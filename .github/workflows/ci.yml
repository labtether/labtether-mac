name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  line-limit:
    name: Handwritten code / 500-line limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check line-limit gate behavior
        run: python3 -m unittest scripts/ci/test_line_limit.py
      - name: Enforce full-repository line limit
        run: python3 scripts/ci/check-line-limit.py

  qa-select:
    name: Select risk-based QA contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native_build: ${{ steps.select.outputs.native_build }}
      mac_installed_app: ${{ steps.select.outputs.mac_installed_app }}
      selected_json: ${{ steps.select.outputs.selected_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test QA contract selector
        run: python3 -m unittest scripts/ci/test_select_qa_contracts.py
      - name: Select contracts
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_MODE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          selector=(python3 scripts/ci/select-qa-contracts.py)
          if [[ "${FULL_MODE}" == "true" || -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            selector+=(--full)
          else
            selector+=(--base "${BASE_SHA}" --head "${GITHUB_SHA}")
          fi
          "${selector[@]}"

  build-and-test:
    needs: [line-limit, qa-select]
    if: ${{ !cancelled() && (needs.line-limit.result != 'success' || needs.qa-select.result != 'success' || needs.qa-select.outputs.native_build != 'false') }}
    name: Fast Swift build and tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Require source-size gate
        shell: bash
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
          QA_SELECT_RESULT: ${{ needs.qa-select.result }}
        run: |
          test "${LINE_LIMIT_RESULT}" = success
          test "${QA_SELECT_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce release isolation policy
        run: ./scripts/test-release-policy.sh
      # This suite also owns the native transport, identity and enrollment checks.
      - name: Run Swift tests
        run: swift test

  mac-installed-app:
    name: Contract / Installed macOS application bundle
    needs: [qa-select, build-and-test]
    if: needs.qa-select.outputs.native_build != 'false' && needs.qa-select.outputs.mac_installed_app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out bundled agent core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: labtether/labtether-agent
          # Coordinated release contract: this exact SHA must match the Go
          # agent source accepted by the root-cause release gate.
          ref: b3051070bb93a9ef6fb4f6acd20b2d37c9ba9eb0
          path: agent-core
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build and validate application bundle
        env:
          LABTETHER_AGENT_REPO: ${{ github.workspace }}/agent-core
          LABTETHER_AGENT_VERSION: ci-${{ github.sha }}
        run: ./scripts/build-app.sh --configuration release
