name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  line-limit:
    name: Handwritten code / 500-line limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check line-limit gate behavior
        run: python3 -m unittest scripts/ci/test_line_limit.py
      - name: Enforce full-repository line limit
        run: python3 scripts/ci/check-line-limit.py

  qa-select:
    name: Select risk-based QA contracts
    runs-on: macos-15
    timeout-minutes: 5
    outputs:
      mac_hub_transport: ${{ steps.select.outputs.mac_hub_transport }}
      mac_installed_app: ${{ steps.select.outputs.mac_installed_app }}
      selected_json: ${{ steps.select.outputs.selected_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test QA contract selector
        run: python3 -m unittest scripts/ci/test_select_qa_contracts.py
      - name: Select contracts
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_MODE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          selector=(python3 scripts/ci/select-qa-contracts.py)
          if [[ "${FULL_MODE}" == "true" || -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            selector+=(--full)
          else
            selector+=(--base "${BASE_SHA}" --head "${GITHUB_SHA}")
          fi
          "${selector[@]}"

  build-and-test:
    needs: [line-limit]
    if: always()
    name: Fast Swift build and tests
    runs-on: macos-15
    steps:
      - name: Require source-size gate
        shell: bash
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
        run: |
          test "${LINE_LIMIT_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce release isolation policy
        run: ./scripts/test-release-policy.sh
      - name: Build Swift host
        run: swift build
      - name: Run Swift tests
        run: swift test

  mac-hub-transport:
    name: Contract / Native Mac-to-Hub transport
    needs: qa-select
    if: needs.qa-select.outputs.mac_hub_transport == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run complete native behavioral suite
        run: swift test

  mac-installed-app:
    name: Contract / Installed macOS application bundle
    needs: qa-select
    if: needs.qa-select.outputs.mac_installed_app == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out bundled agent core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: labtether/labtether-agent
          # Coordinated release contract: this exact SHA must match the Go
          # agent source accepted by the root-cause release gate.
          ref: 91f67f76a09613bea69885a0765e39e0adbc4a0c
          path: agent-core
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Build and validate application bundle
        env:
          LABTETHER_AGENT_REPO: ${{ github.workspace }}/agent-core
          LABTETHER_AGENT_VERSION: ci-${{ github.sha }}
        run: ./scripts/build-app.sh --configuration release
